<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chain-Mind: smart contract intelligence</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0d17'/%3E%3Crect x='4' y='11' width='15' height='10' rx='5' fill='none' stroke='%238da2ff' stroke-width='2'/%3E%3Crect x='13' y='11' width='15' height='10' rx='5' fill='none' stroke='%238da2ff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="/" id="brand" aria-label="Chain-Mind home"></a>
    <nav class="topbar-actions" aria-label="Main">
      <button class="btn btn-ghost" id="btn-history" type="button" aria-controls="drawer" aria-expanded="false">History</button>
      <button class="btn" id="btn-new" type="button">New scan</button>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Scan history" inert>
    <div class="drawer-head">
      <h2>Scan history</h2>
      <button class="btn btn-ghost" id="drawer-close" type="button">Close</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
